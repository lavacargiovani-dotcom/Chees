<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChessPro Master V4</title>
    
    <!-- SCRIPT DO GOOGLE ADSENSE -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8970350393601278"
         crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-green">

    <!-- LOBBY INICIAL -->
    <div id="lobbyScreen" class="lobby-container">
        <div class="lobby-card">
            <div class="lobby-logo">♟</div>
            <h1>ChessPro Master</h1>
            <p>Escolha o modo de jogo para começar</p>
            
            <div class="lobby-buttons">
                <button id="btnLobbyBot" class="btn-lobby btn-primary-glow">
                    <span class="icon">🤖</span>
                    <div class="btn-text">
                        <strong>Jogar contra IA</strong>
                        <small>Desafie o Bot com níveis ajustáveis</small>
                    </div>
                </button>

                <button id="btnLobbyLocal" class="btn-lobby btn-secondary-glow">
                    <span class="icon">👥</span>
                    <div class="btn-text">
                        <strong>Passa e Joga (Local)</strong>
                        <small>Jogue com um amigo no mesmo celular</small>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <!-- TELA DO JOGO (Oculta no início) -->
    <div id="gameScreen" class="app" style="display: none;">
        <header class="header">
            <div class="logo">
                <button id="btnBackLobby" class="btn-icon">←</button>
                <span class="logo-icon">♟</span>
                <h1>ChessPro</h1>
            </div>
            <div class="header-actions">
                <button id="btnNewGame" class="btn-accent">Novo Jogo</button>
            </div>
        </header>

        <main class="main-layout">
            <section class="board-container">
                <div class="eval-bar-container">
                    <div id="evalBar" class="eval-bar" style="height: 50%;"></div>
                    <span id="evalScore" class="eval-score">0.0</span>
                </div>

                <div class="board-area">
                    <div class="player-tag top">
                        <div class="player-info">
                            <span class="avatar">🤖</span>
                            <span class="player-name" id="opponentName">Bot</span>
                        </div>
                        <div class="player-extras">
                            <div id="topCaptured" class="captured-pieces"></div>
                            <div id="topTimer" class="timer">10:00</div>
                        </div>
                    </div>

                    <!-- Div do Tabuleiro com Touch-Action Bloqueado -->
                    <div id="board" class="board"></div>

                    <div class="player-tag bottom">
                        <div class="player-info">
                            <span class="avatar">👤</span>
                            <span class="player-name" id="playerName">Você</span>
                        </div>
                        <div class="player-extras">
                            <div id="bottomCaptured" class="captured-pieces"></div>
                            <div id="bottomTimer" class="timer">10:00</div>
                        </div>
                    </div>
                </div>
            </section>

            <aside class="sidebar">
                <div class="panel">
                    <h3>Estatísticas</h3>
                    <div class="stats-grid">
                        <div class="stat"><span class="label">Rating:</span> <strong>1200</strong></div>
                        <div class="stat"><span class="label">Vitórias:</span> <strong id="winsCount">0</strong></div>
                        <div class="stat"><span class="label">Derrotas:</span> <strong id="lossesCount">0</strong></div>
                    </div>
                </div>

                <div class="panel">
                    <h3>Ajustes</h3>
                    
                    <label for="timeControl">Tempo:</label>
                    <select id="timeControl">
                        <option value="60">1 Minuto</option>
                        <option value="180">3 Minutos</option>
                        <option value="300">5 Minutos</option>
                        <option value="600" selected>10 Minutos</option>
                    </select>

                    <label for="difficulty">Nível do Bot:</label>
                    <select id="difficulty">
                        <option value="1">Fácil</option>
                        <option value="2" selected>Médio</option>
                        <option value="3">Difícil</option>
                    </select>

                    <label for="themeSelect">Tema:</label>
                    <select id="themeSelect">
                        <option value="green">Verde Clássico</option>
                        <option value="dark">Dark Slate</option>
                        <option value="wood">Madeira</option>
                    </select>
                </div>

                <div class="panel moves-panel">
                    <h3>Lances</h3>
                    <div id="moveHistory" class="move-history"></div>
                </div>
            </aside>
        </main>
    </div>

    <!-- MODAL DE PROMOÇÃO -->
    <div id="promotionModal" class="modal">
        <div class="modal-content">
            <h3>Escolha a Promoção</h3>
            <div class="promotion-options">
                <button data-piece="q">♛ Rainha</button>
                <button data-piece="r">♜ Torre</button>
                <button data-piece="b">♝ Bispo</button>
                <button data-piece="n">♞ Cavalo</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
